project:
  name: Fensalir
  root: E:\Projects\Fensalir
  upstream: https://github.com/GameCult/Fensalir.git
  purpose: >
    Native C# runtime and renderer dependency for Aquarium-style clients. The
    engine owns Win32 hosting, D3D12 rendering, input, hot reload, debug UI,
    audio output, client contracts, fractal/field machinery, and engine demos.

current_model:
  solution: Fensalir.sln
  host:
    implementation: src/Aquarium.Engine
    contracts: src/Aquarium.Engine.Contracts
    renderer: src/Aquarium.Engine/Render
    shaders: src/Aquarium.Engine/Render/Shaders
    assets: src/Aquarium.Engine/Assets
    scripts: scripts
  fractal:
    implementation: src/Aquarium.Engine.Fractal
    tests: tests/Aquarium.Engine.Fractal.Tests
    receipt_tool: tools/Aquarium.Fractal.Receipt
  demos:
    fensalir_splash: src/Aquarium.Fensalir
    minimal: src/Aquarium.Sample.Minimal
    zyphos: src/Aquarium.Zyphos
  external_clients:
    epiphany_aquarium: E:\Projects\Aquarium-Engine
    mimir: owns the sensor-fusion app/adapter surface formerly prototyped here
  dependencies:
    cult_math: E:\Projects\CultMath
    cult_lib: E:\Projects\CultLib
    aqua_synth_faust: repo-local NuGet package feed under packages

invariants:
  - Fensalir owns reusable host, renderer, audio, reload, contracts, and engine mechanisms.
  - Client repos own policy, role names, narrative semantics, app state, and client shaders.
  - Epiphany Aquarium depends on Fensalir; Fensalir must not depend on Epiphany.
  - Demo projects inside this repo are allowed to exercise engine features but must not become hidden engine policy.
  - Public `Aquarium.*` assembly names remain for continuity until a deliberate namespace/package migration.

next_actions:
  - Keep origin pointed at https://github.com/GameCult/Fensalir.git.
  - Keep `dotnet build Fensalir.sln` green after the split.
  - Move any remaining client-only Epiphany state found here back to `E:\Projects\Aquarium-Engine`.
  - Keep Mimir app/adapters out of this repo; Fensalir may expose generic sensor-fusion contracts only.
  - Package contracts/host deliberately before replacing sibling source references in client repos.
